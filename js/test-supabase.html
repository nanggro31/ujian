
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Uji Koneksi Supabase</title>
</head>
<body>
    <h2>Pengujian Koneksi Supabase</h2>
    <p id="status">Menghubungkan ke server Supabase...</p>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>

    <script>
        async function testConnection() {
            const status = document.getElementById('status');

            try {
                const response = await fetch(
                    SUPABASE_URL + '/auth/v1/health',
                    {
                        method: 'GET',
                        headers: {
                            'apikey': SUPABASE_PUBLISHABLE_KEY
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error(
                        'Server merespons dengan status HTTP ' +
                        response.status
                    );
                }

                status.textContent =
                    'BERHASIL: Server Supabase dapat dihubungi!';
                status.style.color = 'green';

            } catch (error) {
                status.textContent =
                    'GAGAL: ' + error.message;
                status.style.color = 'red';
            }
        }

        testConnection();
    </script>
</body>
</html>
