<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uji Koneksi Supabase</title>
</head>
<body>
  <h2>Pengujian Koneksi Supabase</h2>
  <p id="status">Memeriksa koneksi...</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>

  <script>
    const status = document.getElementById('status');

    if (window.supabaseClient) {
      status.textContent = 'Koneksi Supabase berhasil diinisialisasi!';
      status.style.color = 'green';
    } else {
      status.textContent = 'Koneksi Supabase gagal. Periksa konfigurasi.';
      status.style.color = 'red';
    }
  </script>
</body>
</html>
