<script>
    // Ganti 2 nilai ini dengan Project URL & anon public key dari Supabase Anda
    const SUPABASE_FUNCTION_URL = "https://ppaffkzuwulcvwevkykw.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_BG2N6vaZcSd7xK6lYnS4DA_V8bN_4UC";

    (function initSupabaseBridge() {
      function createRunner(onSuccess, onFailure) {
        return new Proxy(function () {}, {
          get(_, prop) {
            if (prop === 'withSuccessHandler') return (fn) => createRunner(fn, onFailure);
            if (prop === 'withFailureHandler') return (fn) => createRunner(onSuccess, fn);
            return (...args) => {
              fetch(SUPABASE_FUNCTION_URL, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                  'apikey': SUPABASE_ANON_KEY
                },
                body: JSON.stringify({ fn: String(prop), args })
              })
                .then(async (res) => {
                  const json = await res.json().catch(() => ({}));
                  if (!res.ok || json.error) throw new Error(json.error || ('HTTP ' + res.status));
                  if (typeof onSuccess === 'function') onSuccess(json.result);
                })
                .catch((err) => {
                  if (typeof onFailure === 'function') onFailure(err);
                  else console.error('API Error:', err);
                });
            };
          }
        });
      }

      window.google = {
        script: {
          get run() {
            return createRunner(null, null);
          }
        }
      };
    })();
  </script>
